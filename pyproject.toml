[project]
name = "frictionlab"
version = "0.1.0"
description = "Local-first synthetic UX audit platform"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "browser-use",
  "playwright",
  "httpx",
  "keyring>=25,<27",
  "psutil",
  "pydantic",
  "fastapi",
  "uvicorn",
  "smolagents>=1.26.0",
  "duckdb==1.5.5",
  "opentelemetry-sdk==1.45.0",
]

[project.optional-dependencies]
vision = ["transformers", "torch", "pillow"]
dashboard = [
    "plotly>=6,<7",
    "streamlit>=1.49,<2",
]

[dependency-groups]
dev = ["pytest", "ruff"]
desktop-build = ["pyinstaller>=6,<7"]

[project.gui-scripts]
frictionlab-desktop = "frictionlab.desktop:main"

[project.scripts]
frictionlab = "frictionlab.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frictionlab"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "frictionlab/_assets/configs"
"vendor" = "frictionlab/_assets/vendor"
"site" = "frictionlab/_assets/site"
"examples/phase9-static" = "frictionlab/_assets/examples/phase9-static"
"examples/phase17-pilots" = "frictionlab/_assets/examples/phase17-pilots"
"README.md" = "frictionlab/_assets/README.md"
"RELEASE_NOTES.md" = "frictionlab/_assets/RELEASE_NOTES.md"
"LICENSE" = "frictionlab/_assets/LICENSE"
"CONTRIBUTING.md" = "frictionlab/_assets/CONTRIBUTING.md"
"SECURITY.md" = "frictionlab/_assets/SECURITY.md"
"IMPLEMENTATION_PLAN.md" = "frictionlab/_assets/IMPLEMENTATION_PLAN.md"
"docs" = "frictionlab/_assets/docs"
"THIRD_PARTY_NOTICES.md" = "frictionlab/_assets/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = ["frictionlab", "configs", "vendor", "site", "examples/phase9-static", "examples/phase17-pilots", "docs", "scripts/setup_resources.py", "scripts/build_desktop.py", "scripts/desktop_entry.py", "scripts/accept_desktop.py", "scripts/accept_local_workspace.py", "scripts/build_landing.py", "scripts/verify_release_archives.py", "pyproject.toml", "uv.lock", "README.md", "RELEASE_NOTES.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "IMPLEMENTATION_PLAN.md", "THIRD_PARTY_NOTICES.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
